name: mdmpi_mobile_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.101

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Utility Packages
  http: ^1.2.2
  http_parser: ^4.1.2
  intl: ^0.20.2
  logger: ^2.0.1
  lottie: ^3.3.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  # Used to bake EXIF orientation into scanned document pixels before upload
  # (lib/base/utils/images/document_image.dart). Already present transitively;
  # declared directly because we import it.
  image: ^4.8.0
  file_picker: ^8.0.0
  json_annotation: ^4.9.0
  curved_navigation_bar: ^1.0.6
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.7

  #  connectivity_plus: ^5.0.1
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.1
  smooth_page_indicator: ^1.2.0+3
  permission_handler: ^12.0.0+1

  camera: ^0.11.1
  path_provider: ^2.0.11
  device_info_plus: ^11.5.0

  # google map dependencies
  google_maps_flutter: ^2.11.0
  geolocator: ^14.0.1
  location: ^8.0.0
  google_places_flutter: ^2.1.0
  google_mlkit_text_recognition: ^0.15.0

  # windows dependencies:
  path_provider_windows: ^2.3.0
  url_launcher_windows: ^3.1.5

  # AI / LLM integration (placeholders) -----------------------------------
  # NOTE: Replace these placeholders with the concrete package(s) you want to use.
  # Examples: a local LLM package (llama, llama_cpp_flutter), an OpenAI client, or a
  # specialized Flutter AI toolkit. Pin exact versions before publishing.
  flutter_ai_toolkit: any
  # Optional: Firebase model downloader for on-device custom models
  firebase_ml_model_downloader: any
  # End AI dependencies ---------------------------------------------------
  flutter_polyline_points: ^2.1.0
  animated_marker: ^0.1.4

  # Web socket
  web_socket_channel: ^3.0.3

  # temporary database
  path: ^1.9.1

  # notifications
  rxdart: ^0.27.2
  flutter_local_notifications: ^19.2.1

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1

  #Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  google_sign_in: ^6.2.2
  firebase_storage: ^13.1.0
  cached_network_image: ^3.4.1
  firebase_messaging: ^16.1.2

  #Signature
  signature: ^6.0.0
  #Charts
  fl_chart: ^1.0.0

  #sqflite
  sqflite: ^2.4.2

  #sms & email
  another_telephony: ^0.4.1

  #workmanager
  workmanager: ^0.6.0
  table_calendar: ^3.2.0

dev_dependencies:
  build_runner:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.4.0+2

flutter_launcher_icons:
    android: "launcher_icon"
    ios: false
    image_path: "assets/logos/icon_launcher.png"
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/logos/icon_launcher.png"
    adaptive_icon_foreground_inset: 52


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/vehicles/
    - assets/images/items/
    - assets/images/on_boarding_images/
    - assets/images/user/
    - assets/logos/
    - assets/fonts/
    - assets/icons/
    - assets/icons/categories/
    - assets/icons/principal/
    - assets/icons/request/
    - assets/images/reviews/
    - assets/icons/payment_methods/
    - assets/images/animations/
    # Explicit assets used by the collection bucket button
    - assets/images/bucket-list.png
    - assets/images/animations/bucket-list.gif
    - assets/logos/mdmpi-logo-animation.gif
    - .env
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package