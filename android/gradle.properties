org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Workaround: some Kotlin incremental compilation code fails on Windows when
# plugin sources (under the pub cache) live on a different drive letter than
# the Android project (relativize errors like "this and base files have
# different roots"). Disabling incremental compilation prevents those errors.
# If you prefer incremental compilation, move the project to the same drive
# as the pub cache (usually under C:\Users\<you>\AppData\Local\Pub\Cache) and
# remove this line.
kotlin.incremental=false
