org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -XX:+IgnoreUnrecognizedVMOptions --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
# Workaround: some Kotlin incremental compilation code fails on Windows when
# plugin sources (under the pub cache) live on a different drive letter than
# the Android project (relativize errors like "this and base files have
# different roots"). Disabling incremental compilation prevents those errors.
# If you prefer incremental compilation, move the project to the same drive
# as the pub cache (usually under C:\Users\<you>\AppData\Local\Pub\Cache) and
# remove this line.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# another_telephony 0.4.1 (no newer release) pins Kotlin to JVM 1.8 but leaves
# Java unset, which AGP 9 now defaults to 11. Kotlin then refuses the mismatch.
# Mixed bytecode levels are harmless on Android (D8 dexes both), so report it
# as a warning instead. Remove once that plugin sets matching targets.
kotlin.jvm.target.validation.mode=warning
